<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f0f4f1">
    <title>{% block title %}Salon général{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <header>
      <h1>MS : Chatting app</h1>
      <nav>
        <ul>
          <li><a href="{{ url_for('views.index') }}">Accueil</a></li>
          <li><a href="{{ url_for('views.games') }}">Games</a></li>
          {% if session.get('user_id') %}
            <li>
              <form action="{{ url_for('views.logout') }}" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button class="nav-logout" type="submit">Déconnexion</button>
              </form>
            </li>
          {% endif %}
        </ul>
      </nav>
    </header>
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
  </body>
</html>
